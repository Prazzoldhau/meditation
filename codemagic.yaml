workflows:
  android-workflow:
    name: Osho Meditation - Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      # android/ is committed (like the qr_scanner app), so no `flutter create`.
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - aestheticphysiox@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: Osho Meditation - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # Requires an App Store Connect integration + iOS code signing set up
      # in Codemagic UI (Team settings > Code signing identities) before
      # this workflow will succeed.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.oshomeditation.oshoMeditation
    scripts:
      # ios/ is NOT committed - regenerate it, then fetch packages + icons.
      - name: Generate native project and packages
        script: PLATFORMS=ios bash scripts/codemagic_pre_build.sh
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - aestheticphysiox@gmail.com
        notify:
          success: true
          failure: true
