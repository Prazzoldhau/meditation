name: osho_meditation
description: "Osho Meditation - stream guided meditation audio from Supabase Storage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  just_audio: ^0.9.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # Loaded at runtime by the in-app loading screen (BrandedLoader). The rest
    # of assets/branding/ is source art for the launcher icon (already baked
    # into android/app/src/main/res/ and regenerated on CI by
    # flutter_launcher_icons).
    - assets/branding/osho_logo_transparent.png

# Launcher icon. The generated output is committed under
# android/app/src/main/res/ so the app has the OSHO icon even without a
# generation step; CI also re-runs `dart run flutter_launcher_icons` (see
# scripts/codemagic_pre_build.sh), which is idempotent.
# The logo is used for BOTH adaptive-icon layers: foreground = the crisp
# padded logo, background = an oversized faded watermark of the same logo.
flutter_launcher_icons:
  image_path: "assets/branding/osho_logo.png"
  android: true
  ios: false
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
